/**:
  ros__parameters:
    # Camera input. The full-rate topic gives the freshest frames; the node only
    # runs inference once per process_interval, so most frames are dropped
    # cheaply (~4% of a core on a CM5 vs the 2 Hz throttled topic).
    input_topic: /cam0/image_raw/compressed

    # Seconds between inferences. This is the main CPU lever: on a CM5 with no
    # hand in view, 0.1 costs ~53% of a core, 0.25 ~44%, 0.5 ~18%. Low values
    # starve rosbridge and make the GCS camera feed lag.
    process_interval: 0.5
    output_topic: /hand_gesture_detections

    # Absolute path to the recognizer model on the drone.
    model_path: /home/dexi/dexi_ws/src/dexi_hand_gesture/data/hand_landmarker.task

    # Below this score a hand is reported as "unknown" rather than a gesture.
    min_gesture_score: 0.5

    # Majority vote over the last N classifications before publishing. Suppresses
    # mid-transition flicker; at 2 Hz a window of 3 costs up to ~1.5s to switch.
    vote_window: 3
